# Appearance
hide_window_decorations yes 
# background #2f323f
# foreground #ffffff
# cursor #f81ce5
cursor_shape block
cursor_blink_interval 0

# Font
font_family JetBrainsMono Nerd Font
font_size 10.0

# Padding
window_padding_width 12 14

# Selection
# selection_foreground #000000
# selection_background #f81ce5

# Color palette
# color0  #282c34
# color1  #e06c75
# color2  #98c379
# color3  #d19a66
# color4  #56b6c2
# color5  #c678dd
# color6  #56b6c2
# color7  #d0d0d0
# color8  #808080
# color9  #e06c75
# color10 #98c379
# color11 #d19a66
# color12 #56b6c2
# color13 #c678dd
# color14 #56b6c2
# color15 #ffffff

# Keybindings
map ctrl+d launch --location=vsplit
map ctrl+shift+d launch --location=hsplit
map ctrl+w close_window
map ctrl+t new_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+shift+alt+left  move_window_to_screen left
map ctrl+shift+alt+right move_window_to_screen right

paste_actions no-op

# BEGIN_KITTY_THEME
# VSCode_Dark
include current-theme.conf
# END_KITTY_THEME
